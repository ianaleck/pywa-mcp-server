[project]
name = "pywa-mcp-server"
version = "0.1.0"
description = "MCP server exposing the pywa WhatsApp Cloud API client as ~100 auto-discovered tools"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ian Aleck" },
]
keywords = ["mcp", "whatsapp", "pywa", "model-context-protocol", "claude", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.27.0",
    "python-dotenv>=1.2.2",
    "pywa>=3.9.0",
]

[project.urls]
Homepage = "https://github.com/ianaleck/pywa-mcp-server"
Repository = "https://github.com/ianaleck/pywa-mcp-server"
Issues = "https://github.com/ianaleck/pywa-mcp-server/issues"
Documentation = "https://github.com/ianaleck/pywa-mcp-server#readme"

[project.scripts]
pywa-mcp-server = "pywa_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pywa_mcp_server"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=7.1.0",
]
